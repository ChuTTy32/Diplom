# =============================================================================
# RansomGuard — Docker Compose (single-host demo)
#
# Сетевая изоляция:
#   backend_net  172.20.0.0/24  — внутренний трафик (agent, borg, tsdb, backend)
#   frontend_net               — изолированная сеть UI
#
# Production multi-host сценарий (несколько машин):
#   Трафик между агентами и backend шифруется через WireGuard VPN.
#   Конфигурация: wireguard/ (ключи, скрипты, README).
#   В single-host demo WireGuard не используется — все сервисы
#   общаются по Docker bridge в изолированных сетях.
# =============================================================================

networks:
  backend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  frontend_net:
    driver: bridge

volumes:
  timescale_data:
  borg_repo:
  # Общий канал для одноразовой передачи ключей WireGuard/SSH borg-server → borg
  borg_secrets:

services:

  # ─── TimescaleDB ────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: tsdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-metrics}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      backend_net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-metrics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@timescaledb:5432/${POSTGRES_DB:-metrics}
      SQLITE_PATH: /app/data/audit.db
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      # python вместо curl — его нет в python:3.11-slim
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Python агент ────────────────────────────────────────────────────
  # privileged + монтирование ядра — требования для eBPF kprobe/vfs_write
  # (privileged уже включает CAP_BPF/CAP_PERFMON/SYS_ADMIN)
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent
    restart: unless-stopped
    privileged: true
    # pid: host — eBPF отдаёт PID в пространстве хоста; чтобы агент мог
    # завершить процесс-шифровальщик (os.kill) и читать /proc/<pid>/exe
    # для whitelist по пути бинаря, ему нужно общее с хостом PID-пространство.
    pid: host
    volumes:
      - ./agent:/app
      - ${WATCH_PATH:-/tmp/monitored}:/monitored
      - /usr/src:/usr/src:ro
      - /lib/modules:/lib/modules:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      BORG_URL: http://borg:9102
      WATCH_PATH: /monitored
      ENTROPY_THRESHOLD: ${ENTROPY_THRESHOLD:-7.2}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-5}
    networks:
      - backend_net
    depends_on:
      backend:
        condition: service_healthy

  # ─── Borg-сервер (изолированный узел хранения, серверный WORM) ────────
  # Держит репозиторий и навязывает append-only через `borg serve`.
  # SSH доступен только на адресе WireGuard-туннеля — репозиторий
  # недостижим иначе как через VPN (Zero Trust).
  borgserver:
    build:
      context: ./borg-server
      dockerfile: Dockerfile
    container_name: borgserver
    restart: unless-stopped
    privileged: true            # WireGuard (NET_ADMIN, создание wg-интерфейса)
    environment:
      BORG_PASSPHRASE: ${BORG_PASSPHRASE:-changeme}
    volumes:
      - borg_repo:/repo
      - borg_secrets:/secrets
    networks:
      - backend_net

  # ─── Borg-клиент ─────────────────────────────────────────────────────
  # Бэкапит /monitored и пушит на borg-server по ssh:// ЧЕРЕЗ WireGuard.
  borg:
    build:
      context: ./borg
      dockerfile: Dockerfile
    container_name: borg
    restart: unless-stopped
    privileged: true            # WireGuard-туннель до borg-server
    env_file: .env
    environment:
      BORG_REPO: ssh://root@10.8.0.1//repo
      BORG_PASSPHRASE: ${BORG_PASSPHRASE:-changeme}
      BACKUP_SOURCE: /monitored
      BACKEND_URL: http://backend:8000
    volumes:
      - ${WATCH_PATH:-/tmp/monitored}:/monitored
      - borg_secrets:/secrets
    networks:
      - backend_net
    depends_on:
      - backend
      - borgserver

  # ─── Nuxt 4 frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - frontend_net
    depends_on:
      - backend
